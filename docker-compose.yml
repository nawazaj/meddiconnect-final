services:
  postgres:
    image: postgres:16
    container_name: mediconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mediconnect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mediconnect_dev
    ports:
      - "5432:5432"
    volumes:
      - mediconnect_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
  mediconnect_pgdata:
